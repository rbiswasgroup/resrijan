name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ghostscript librsvg2-bin fonts-liberation libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and end-to-end tests (GUI tests run headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Smoke test every example
        run: python tools/build_examples.py

  validation:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ghostscript librsvg2-bin fonts-liberation
          pip install -e ".[dev]"
      - name: Ground-truth validation
        run: |
          python validation/make_testset.py testset
          python validation/run_validation.py testset results
      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: results/validation.md
